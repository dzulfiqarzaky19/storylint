services:
  db:
    image: postgres:17-alpine
    container_name: storylint-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: storylint
      POSTGRES_PASSWORD: storylint
      POSTGRES_DB: storylint
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storylint -d storylint"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate database, port and volume, so tests can reset and seed freely
  # without touching the dev data in `db`.
  db_test:
    image: postgres:17-alpine
    container_name: storylint-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: storylint
      POSTGRES_PASSWORD: storylint
      POSTGRES_DB: storylint_test
    ports:
      - "5435:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storylint -d storylint_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web-search backend for the research chat (WEBSEARCH_SEARXNG_URL in .env).
  searxng:
    # Pinned by digest; update deliberately.
    image: searxng/searxng@sha256:cd22dbf7fac8b25d5e39e65af53a4b47009df5ad3162e270c477fd5b30ce03f2
    container_name: storylint-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O - 'http://localhost:8080/search?q=ping&format=json' | grep -q results"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  pgdata_test:
